<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none" role="img" aria-label="つながるまなび">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Icon mark (72×72) ── -->
  <rect width="72" height="72" rx="20" fill="url(#iconBg)"/>

  <!-- Glow ring on icon -->
  <rect x="1" y="1" width="70" height="70" rx="19" stroke="white" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Connection arcs forming the shape of "つ" -->
  <!-- Top horizontal: left node → right node -->
  <line x1="23" y1="22" x2="49" y2="22"
    stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Curve: right node sweeps down and left to bottom node -->
  <path d="M54 28 Q60 52 44 58 Q34 63 24 55"
    stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Nodes — soft glow aura then solid dot -->
  <!-- Top-left node -->
  <circle cx="17" cy="22" r="9" fill="white" fill-opacity="0.12"/>
  <circle cx="17" cy="22" r="5.5" fill="white"/>
  <!-- Top-right node -->
  <circle cx="54" cy="22" r="9" fill="white" fill-opacity="0.12"/>
  <circle cx="54" cy="22" r="5.5" fill="white"/>
  <!-- Bottom node (larger = goal/destination) -->
  <circle cx="19" cy="53" r="10" fill="white" fill-opacity="0.14"/>
  <circle cx="19" cy="53" r="7" fill="white"/>

  <!-- Inner dot on bottom node (indigo, representing "core learning") -->
  <circle cx="19" cy="53" r="2.5" fill="#4338ca" fill-opacity="0.6"/>

  <!-- ── Logotype ── -->
  <!-- Subtitle: "つながる" in slate -->
  <text
    x="90" y="34"
    font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif"
    font-size="18" font-weight="700" letter-spacing="1"
    fill="#334155">つながる</text>

  <!-- Main word: "まなび" in indigo, larger -->
  <text
    x="90" y="62"
    font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif"
    font-size="24" font-weight="800" letter-spacing="3"
    fill="url(#textAccent)">まなび</text>
</svg>
